<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Doppelcheck">
  <title>Doppelcheck</title>
  <!-- Glyph-only mark: TWO checks, clearly separated, so it reads as "doppel"-check
       and not as a single tick, at 16 and 32 px where the wordmark was unreadable.
       Palette is the site's own (assets/css/style.css): midnight #0A0F1F ground,
       brand amber #F59A00, cream #F1EADC. True vector — no embedded raster. -->
  <rect width="64" height="64" rx="14" fill="#0A0F1F"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M9 34 L19 44 L33 24" stroke="#F59A00"/>
    <path d="M33 34 L43 44 L57 24" stroke="#F1EADC"/>
  </g>
</svg>
